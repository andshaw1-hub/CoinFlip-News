<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Nutrition Tracker</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --panel-3: #2f4460;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22c55e;
    --accent-dim: #16a34a;
    --danger: #ef4444;
    --cal: #f59e0b;
    --pro: #38bdf8;
    --carb: #a78bfa;
    --fat: #fb7185;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { margin: 0; font-size: 1.6rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
  }

  /* Date bar */
  .date-bar { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .date-bar button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    width: 38px; height: 38px; font-size: 1.1rem; cursor: pointer;
  }
  .date-bar input[type=date] {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 0.95rem; color-scheme: dark;
  }
  .today-btn { font-size: 0.85rem !important; width: auto !important; padding: 0 12px; }

  /* Totals */
  .totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 4px; }
  .stat {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 8px; text-align: center;
  }
  .stat .val { font-size: 1.35rem; font-weight: 700; }
  .stat .lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat.cal .val { color: var(--cal); }
  .stat.pro .val { color: var(--pro); }
  .stat.carb .val { color: var(--carb); }
  .stat.fat .val { color: var(--fat); }

  .goal-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .goal-row label { color: var(--muted); font-size: 0.85rem; }
  .goal-row input { width: 90px; }
  .bar { height: 8px; background: var(--panel-2); border-radius: 6px; overflow: hidden; flex: 1; min-width: 120px; }
  .bar > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .bar.over > span { background: var(--danger); }
  .goal-text { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }

  input, select {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 0.95rem;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }

  /* ── Search / add ─────────────────────────────────────────── */
  .search-wrap { position: relative; }
  #foodSearch { font-size: 1.05rem; padding: 13px 14px; }
  .results {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,.4);
  }
  .results:empty { display: none; }
  .res {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: transparent; border: none; border-bottom: 1px solid var(--border);
    color: var(--text); text-align: left; padding: 11px 14px; cursor: pointer;
  }
  .res:last-child { border-bottom: none; }
  .res:hover, .res.active { background: var(--panel-2); }
  .res .rname { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res .rmeta { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  .res .tag {
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: .04em;
    padding: 2px 6px; border-radius: 5px; background: var(--panel-3); color: var(--muted);
  }
  .res.loading { color: var(--muted); cursor: default; font-size: 0.85rem; justify-content: center; }
  .res.loading:hover { background: transparent; }

  .web-toggle { display: flex; align-items: center; gap: 7px; margin-top: 10px; color: var(--muted); font-size: 0.8rem; }
  .web-toggle input { width: auto; }

  /* Portion panel */
  .portion { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
  .portion[hidden] { display: none; }
  .p-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .p-name { font-size: 1.1rem; font-weight: 700; }
  .p-clear { background: transparent; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; }
  .p-clear:hover { color: var(--danger); }

  .qty-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .qty-row button.step {
    width: 42px; height: 42px; flex: none; font-size: 1.3rem;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 9px; cursor: pointer;
  }
  .qty-row button.step:hover { background: var(--panel-3); }
  .qty-row input { text-align: center; width: 80px; flex: none; font-size: 1.05rem; }
  .qty-row select { flex: 1; }
  .serving-hint { font-size: 0.78rem; color: var(--muted); margin-top: 6px; }

  .preview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
  .pv { text-align: center; background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 9px 4px; }
  .pv b { display: block; font-size: 1.15rem; }
  .pv span { font-size: 0.66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .pv.cal b { color: var(--cal); } .pv.pro b { color: var(--pro); }
  .pv.carb b { color: var(--carb); } .pv.fat b { color: var(--fat); }

  .meal-row { margin: 12px 0; }
  .meal-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .chips { display: flex; gap: 8px; margin-top: 7px; flex-wrap: wrap; }
  .chip {
    flex: 1; min-width: 70px; padding: 9px 6px; text-align: center; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px;
    color: var(--muted); font-size: 0.85rem; font-weight: 600;
  }
  .chip.sel { background: var(--accent); border-color: var(--accent); color: #05240f; }

  .btn-add {
    width: 100%; background: var(--accent); color: #05240f;
    border: none; border-radius: 9px; padding: 13px; font-size: 1rem;
    font-weight: 700; cursor: pointer;
  }
  .btn-add:hover { background: var(--accent-dim); }

  .link-btn {
    display: block; margin: 14px auto 0; background: none; border: none;
    color: var(--muted); font-size: 0.85rem; cursor: pointer; text-decoration: underline;
  }
  .link-btn:hover { color: var(--text); }

  .manual[hidden] { display: none; }
  .manual { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
  .m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .m-grid .full { grid-column: 1 / -1; }
  label.field { display: block; font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; }

  /* Entries */
  .meal-group { margin-bottom: 16px; }
  .meal-group h3 {
    margin: 0 0 8px; font-size: 0.8rem; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .meal-group h3 .mcals { color: var(--cal); font-weight: 700; }
  .entry {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
  }
  .entry .info { flex: 1; min-width: 0; }
  .entry .name { font-weight: 600; }
  .entry .macros { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .entry .kcal { font-weight: 700; color: var(--cal); white-space: nowrap; }
  .entry .del {
    background: transparent; border: none; color: var(--muted);
    font-size: 1.2rem; cursor: pointer; padding: 2px 6px; line-height: 1;
  }
  .entry .del:hover { color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }

  .footer-note { text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 8px; }
  @media (max-width: 480px) { .totals { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🥗 Daily Nutrition Tracker</h1>
    <p>Search a food, pick how much, and it does the numbers for you.</p>
  </header>

  <!-- Date + summary -->
  <div class="card">
    <div class="date-bar">
      <button id="prevDay" title="Previous day">‹</button>
      <input type="date" id="datePicker">
      <button id="nextDay" title="Next day">›</button>
      <button id="todayBtn" class="today-btn">Today</button>
    </div>
    <div class="totals">
      <div class="stat cal"><div class="val" id="tCal">0</div><div class="lbl">Calories</div></div>
      <div class="stat pro"><div class="val" id="tPro">0g</div><div class="lbl">Protein</div></div>
      <div class="stat carb"><div class="val" id="tCarb">0g</div><div class="lbl">Carbs</div></div>
      <div class="stat fat"><div class="val" id="tFat">0g</div><div class="lbl">Fat</div></div>
    </div>
    <div class="goal-row">
      <label for="goal">Daily goal</label>
      <input type="number" id="goal" min="0" step="50" placeholder="e.g. 2000">
      <div class="bar" id="goalBar"><span></span></div>
      <div class="goal-text" id="goalText">Set a goal</div>
    </div>
  </div>

  <!-- Add food -->
  <div class="card">
    <div class="search-wrap">
      <input type="text" id="foodSearch" placeholder="🔍  Search a food… e.g. chicken breast" autocomplete="off">
      <div class="results" id="results"></div>
    </div>
    <label class="web-toggle">
      <input type="checkbox" id="webToggle" checked>
      Also search the web for more foods (Open Food Facts — free, no account)
    </label>

    <!-- Portion picker (shown after selecting a food) -->
    <div class="portion" id="portion" hidden>
      <div class="p-head">
        <span class="p-name" id="pName"></span>
        <button class="p-clear" id="pClear" title="Choose a different food">✕</button>
      </div>

      <div class="qty-row">
        <button type="button" class="step" id="qtyMinus">−</button>
        <input type="number" id="qtyInput" min="0" step="0.5" value="1">
        <select id="unitSelect">
          <option value="serving">serving(s)</option>
          <option value="g">grams</option>
        </select>
        <button type="button" class="step" id="qtyPlus">+</button>
      </div>
      <div class="serving-hint" id="servingHint"></div>

      <div class="preview">
        <div class="pv cal"><b id="pvCal">0</b><span>kcal</span></div>
        <div class="pv pro"><b id="pvPro">0</b><span>protein</span></div>
        <div class="pv carb"><b id="pvCarb">0</b><span>carbs</span></div>
        <div class="pv fat"><b id="pvFat">0</b><span>fat</span></div>
      </div>

      <div class="meal-row">
        <span class="meal-label">Meal</span>
        <div class="chips" id="mealChips"></div>
      </div>

      <button type="button" class="btn-add" id="addBtn">+ Add to day</button>
    </div>

    <!-- Manual fallback -->
    <button type="button" class="link-btn" id="manualToggle">Can’t find it? Enter it manually</button>
    <div class="manual" id="manualForm" hidden>
      <div class="m-grid">
        <div class="full">
          <label class="field" for="mName">Food name</label>
          <input type="text" id="mName" placeholder="e.g. Grandma's stew">
        </div>
        <div><label class="field" for="mCal">Calories</label><input type="number" id="mCal" min="0" placeholder="0"></div>
        <div><label class="field" for="mMeal">Meal</label>
          <select id="mMeal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select>
        </div>
        <div><label class="field" for="mPro">Protein (g)</label><input type="number" id="mPro" min="0" step="0.1" placeholder="0"></div>
        <div><label class="field" for="mCarb">Carbs (g)</label><input type="number" id="mCarb" min="0" step="0.1" placeholder="0"></div>
        <div><label class="field" for="mFat">Fat (g)</label><input type="number" id="mFat" min="0" step="0.1" placeholder="0"></div>
      </div>
      <button type="button" class="btn-add" id="manualAdd" style="margin-top:12px">+ Add to day</button>
    </div>
  </div>

  <!-- Entries -->
  <div class="card"><div id="entries"></div></div>

  <p class="footer-note">Your food log is saved privately in this browser — nothing is uploaded.</p>
</div>

    ["ketchup",17,17,0.2,4.5,0],["mustard",5,3,0.2,0.3,0.2],["bbq sauce",36,60,0,15,0],
    ["soy sauce",16,8,1.3,0.8,0],["salsa",36,10,0.5,2,0],["honey",21,64,0.1,17,0],
    ["jam|jelly",20,56,0.1,14,0],["maple syrup",20,52,0,13,0],["sugar",4,16,0,4,0]
  ].map(function (r) {
    var a = r[0].split("|");
    return { a: a, name: cap(a[0]), g: r[1], kcal: r[2], pro: r[3], carb: r[4], fat: r[5], src: "local" };
  });

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // ============ State ============
  var entries = load(STORE_KEY, {});
  var selectedDate = todayStr();
  var selected = null;          // currently chosen food
  var selectedMeal = defaultMeal();
  var webEnabled = localStorage.getItem(WEB_KEY) !== "0";
  var results = [];             // current dropdown result list
  var searchToken = 0;

  // ============ Helpers ============
  function todayStr() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  function load(key, fb) { try { var v = JSON.parse(localStorage.getItem(key)); return v == null ? fb : v; } catch (e) { return fb; } }
  function save() { localStorage.setItem(STORE_KEY, JSON.stringify(entries)); }
  function num(v) { var n = parseFloat(v); return isNaN(n) || n < 0 ? 0 : n; }
  function round(n) { return Math.round(n * 10) / 10; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function defaultMeal() { var h = new Date().getHours(); return h < 11 ? "Breakfast" : h < 16 ? "Lunch" : h < 21 ? "Dinner" : "Snack"; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function shiftDate(days) { var d = new Date(selectedDate + "T00:00:00"); d.setDate(d.getDate() + days); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }

  // ============ Day summary + entries ============
  function render() {
    $("datePicker").value = selectedDate;
    var list = entries[selectedDate] || [];
    var t = { cal: 0, pro: 0, carb: 0, fat: 0 };
    list.forEach(function (e) { t.cal += e.cal; t.pro += e.pro; t.carb += e.carb; t.fat += e.fat; });
    $("tCal").textContent = Math.round(t.cal);
    $("tPro").textContent = round(t.pro) + "g";
    $("tCarb").textContent = round(t.carb) + "g";
    $("tFat").textContent = round(t.fat) + "g";
    renderGoal(t.cal);
    renderEntries(list);
  }

  function renderGoal(calTotal) {
    var goal = num($("goal").value), bar = $("goalBar"), span = bar.firstElementChild, text = $("goalText");
    if (goal > 0) {
      span.style.width = Math.min(100, (calTotal / goal) * 100) + "%";
      var rem = Math.round(goal - calTotal);
      if (rem >= 0) { bar.classList.remove("over"); text.textContent = rem + " kcal left"; }
      else { bar.classList.add("over"); text.textContent = Math.abs(rem) + " kcal over"; }
    } else { span.style.width = "0"; bar.classList.remove("over"); text.textContent = "Set a goal"; }
  }

  function renderEntries(list) {
    if (!list.length) { $("entries").innerHTML = '<div class="empty">No food logged for this day yet.<br>Search a food above to get started. 🍽️</div>'; return; }
    var html = "";
    MEALS.forEach(function (meal) {
      var items = list.filter(function (e) { return e.meal === meal; });
      if (!items.length) return;
      var mc = items.reduce(function (s, e) { return s + e.cal; }, 0);
      html += '<div class="meal-group"><h3>' + meal + ' <span class="mcals">' + Math.round(mc) + ' kcal</span></h3>';
      items.forEach(function (e) {
        html += '<div class="entry"><div class="info"><div class="name">' + esc(e.name) + '</div>' +
          '<div class="macros">P ' + round(e.pro) + 'g · C ' + round(e.carb) + 'g · F ' + round(e.fat) + 'g</div></div>' +
          '<div class="kcal">' + Math.round(e.cal) + ' kcal</div>' +
          '<button class="del" data-id="' + e.id + '" title="Delete">✕</button></div>';
      });
      html += '</div>';
    });
    $("entries").innerHTML = html;
  }

  // ============ Search ============
  function searchLocal(q) {
    q = q.toLowerCase().trim();
    if (!q) return [];
    var scored = [];
    FOODS.forEach(function (f) {
      var best = Infinity;
      f.a.forEach(function (al) { var i = al.indexOf(q); if (i !== -1) best = Math.min(best, i === 0 ? 0 : 1 + i / 100); });
      if (best < Infinity) scored.push({ f: f, s: best });
    });
    scored.sort(function (x, y) { return x.s - y.s || x.f.a[0].length - y.f.a[0].length; });
    return scored.slice(0, 8).map(function (x) { return x.f; });
  }

  function parseServing(s) { if (!s) return null; var m = String(s).match(/([\d.]+)\s*g/i); return m ? parseFloat(m[1]) : null; }

  function searchOnline(q) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 6000);
    var url = "https://world.openfoodfacts.org/cgi/search.pl?search_terms=" + encodeURIComponent(q) +
      "&search_simple=1&action=process&json=1&page_size=12" +
      "&fields=product_name,brands,nutriments,serving_size";
    return fetch(url, { signal: ctrl.signal })
      .then(function (r) { clearTimeout(timer); return r.ok ? r.json() : { products: [] }; })
      .then(function (data) {
        var out = [];
        (data.products || []).forEach(function (p) {
          var nm = p.nutriments || {}, kcal = nm["energy-kcal_100g"];
          if (kcal == null || !p.product_name) return;
          var name = p.product_name.trim();
          if (p.brands) name += " (" + String(p.brands).split(",")[0].trim() + ")";
          var sg = parseServing(p.serving_size), g = sg || 100, k = g / 100;
          out.push({ a: [name.toLowerCase()], name: name.slice(0, 55), g: g,
            kcal: round(kcal * k), pro: round((nm.proteins_100g || 0) * k),
            carb: round((nm.carbohydrates_100g || 0) * k), fat: round((nm.fat_100g || 0) * k),
            src: "web", per100: !sg });
        });
        return out.slice(0, 8);
      })
      .catch(function () { clearTimeout(timer); return []; });
  }

  function renderResults(list, loading) {
    results = list;
    var html = list.map(function (f, i) {
      var tag = f.src === "web" ? '<span class="tag">web</span>' : "";
      var unit = f.per100 ? "/100g" : "";
      return '<button class="res" data-i="' + i + '">' +
        '<span class="rname">' + esc(f.name) + '</span>' + tag +
        '<span class="rmeta">' + Math.round(f.kcal) + ' kcal · ' + round(f.pro) + 'g P' + unit + '</span></button>';
    }).join("");
    if (loading) html += '<div class="res loading">Searching the web…</div>';
    if (!html && !loading) html = '<div class="res loading">No matches — try another name, or enter it manually below.</div>';
    $("results").innerHTML = html;
  }

  function doSearch(q) {
    if (!q.trim()) { $("results").innerHTML = ""; return; }
    var localHits = searchLocal(q);
    var willWeb = webEnabled && q.trim().length >= 3;
    renderResults(localHits, willWeb && localHits.length < 8);
    if (willWeb) {
      var my = ++searchToken;
      searchOnline(q).then(function (web) {
        if (my !== searchToken) return;           // a newer search superseded this
        // drop web items that duplicate a local name
        var seen = {}; localHits.forEach(function (f) { seen[f.name.toLowerCase()] = 1; });
        var merged = localHits.concat(web.filter(function (f) { return !seen[f.name.toLowerCase()]; }));
        renderResults(merged.slice(0, 12), false);
      });
    }
  }

  // ============ Portion picker ============
  function selectFood(f) {
    selected = f;
    $("results").innerHTML = "";
    $("foodSearch").value = f.name;
    $("pName").textContent = f.name;
    $("unitSelect").value = "serving";
    $("qtyInput").value = 1;
    $("qtyInput").step = 0.5;
    selectedMeal = defaultMeal();
    renderMealChips();
    updatePreview();
    $("portion").hidden = false;
    $("manualForm").hidden = true;
  }

  function renderMealChips() {
    $("mealChips").innerHTML = MEALS.map(function (m) {
      return '<div class="chip' + (m === selectedMeal ? " sel" : "") + '" data-meal="' + m + '">' + m + '</div>';
    }).join("");
  }

  function currentFactor() {
    var qty = num($("qtyInput").value);
    if ($("unitSelect").value === "g") return selected.g > 0 ? qty / selected.g : 0;
    return qty;
  }

  function updatePreview() {
    if (!selected) return;
    var f = currentFactor();
    $("pvCal").textContent = Math.round(selected.kcal * f);
    $("pvPro").textContent = round(selected.pro * f);
    $("pvCarb").textContent = round(selected.carb * f);
    $("pvFat").textContent = round(selected.fat * f);
    var unit = $("unitSelect").value;
    var hint = selected.per100 ? "Web values are per 100 g" : "1 serving ≈ " + selected.g + " g";
    $("servingHint").textContent = hint + (unit === "g" ? "" : "");
  }

  function amountLabel() {
    var qty = num($("qtyInput").value);
    if ($("unitSelect").value === "g") return Math.round(qty) + "g ";
    return qty === 1 ? "" : round(qty) + "× ";
  }

  function addSelected() {
    if (!selected) return;
    var f = currentFactor();
    if (f <= 0) { $("qtyInput").focus(); return; }
    pushEntry({
      name: amountLabel() + selected.name, meal: selectedMeal,
      cal: selected.kcal * f, pro: selected.pro * f, carb: selected.carb * f, fat: selected.fat * f
    });
    // reset for the next food
    selected = null;
    $("portion").hidden = true;
    $("foodSearch").value = "";
    $("results").innerHTML = "";
    $("foodSearch").focus();
  }

  function pushEntry(e) {
    e.id = uid();
    if (!entries[selectedDate]) entries[selectedDate] = [];
    entries[selectedDate].push(e);
    save();
    render();
  }

  // ============ Manual entry ============
  function addManual() {
    var name = $("mName").value.trim();
    var cal = num($("mCal").value);
    if (!name) { $("mName").focus(); return; }
    pushEntry({ name: name, meal: $("mMeal").value, cal: cal, pro: num($("mPro").value), carb: num($("mCarb").value), fat: num($("mFat").value) });
    ["mName", "mCal", "mPro", "mCarb", "mFat"].forEach(function (id) { $(id).value = ""; });
  }

  function deleteEntry(id) {
    var list = entries[selectedDate] || [];
    entries[selectedDate] = list.filter(function (e) { return e.id !== id; });
    if (!entries[selectedDate].length) delete entries[selectedDate];
    save();
    render();
  }

  // ============ Events ============
  var searchTimer;
  $("foodSearch").addEventListener("input", function () {
    var q = this.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { doSearch(q); }, 160);
  });
  $("foodSearch").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && results.length) { e.preventDefault(); selectFood(results[0]); }
    else if (e.key === "Escape") { $("results").innerHTML = ""; }
  });
  $("results").addEventListener("click", function (e) {
    var b = e.target.closest(".res[data-i]");
    if (b) selectFood(results[+b.getAttribute("data-i")]);
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".search-wrap")) $("results").innerHTML = "";
  });

  $("qtyMinus").addEventListener("click", function () {
    var step = $("unitSelect").value === "g" ? 10 : 0.5;
    $("qtyInput").value = Math.max(0, round(num($("qtyInput").value) - step));
    updatePreview();
  });
  $("qtyPlus").addEventListener("click", function () {
    var step = $("unitSelect").value === "g" ? 10 : 0.5;
    $("qtyInput").value = round(num($("qtyInput").value) + step);
    updatePreview();
  });
  $("qtyInput").addEventListener("input", updatePreview);
  $("unitSelect").addEventListener("change", function () {
    if (this.value === "g") { $("qtyInput").value = selected ? selected.g : 100; $("qtyInput").step = 10; }
    else { $("qtyInput").value = 1; $("qtyInput").step = 0.5; }
    updatePreview();
  });
  $("mealChips").addEventListener("click", function (e) {
    var c = e.target.closest(".chip"); if (!c) return;
    selectedMeal = c.getAttribute("data-meal"); renderMealChips();
  });
  $("addBtn").addEventListener("click", addSelected);
  $("pClear").addEventListener("click", function () {
    selected = null; $("portion").hidden = true; $("foodSearch").value = ""; $("foodSearch").focus();
  });

  $("manualToggle").addEventListener("click", function () {
    var m = $("manualForm"); m.hidden = !m.hidden;
    if (!m.hidden) { $("portion").hidden = true; $("mMeal").value = defaultMeal(); $("mName").focus(); }
  });
  $("manualAdd").addEventListener("click", addManual);

  $("webToggle").addEventListener("change", function () {
    webEnabled = this.checked;
    localStorage.setItem(WEB_KEY, webEnabled ? "1" : "0");
    if ($("foodSearch").value) doSearch($("foodSearch").value);
  });

  $("entries").addEventListener("click", function (e) {
    var b = e.target.closest(".del"); if (b) deleteEntry(b.getAttribute("data-id"));
  });
  $("prevDay").addEventListener("click", function () { selectedDate = shiftDate(-1); render(); });
  $("nextDay").addEventListener("click", function () { selectedDate = shiftDate(1); render(); });
  $("todayBtn").addEventListener("click", function () { selectedDate = todayStr(); render(); });
  $("datePicker").addEventListener("change", function () { if (this.value) { selectedDate = this.value; render(); } });
  $("goal").addEventListener("input", function () { localStorage.setItem(GOAL_KEY, this.value); render(); });

  // ============ Init ============
  $("goal").value = localStorage.getItem(GOAL_KEY) || "";
  $("webToggle").checked = webEnabled;
  render();
})();
</script>
</body>
</html>
